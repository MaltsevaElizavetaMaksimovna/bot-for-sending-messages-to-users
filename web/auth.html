<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VK Teams — Авторизация</title>

    <!-- VK Sans Font -->
    <style>
      @font-face {
        font-family: 'VK Sans';
        src: url('https://vk.com/fonts/VKSans-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'VK Sans';
        src: url('https://vk.com/fonts/VKSans-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'VK Sans';
        src: url('https://vk.com/fonts/VKSans-DemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'VK Sans';
        src: url('https://vk.com/fonts/VKSans-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'VK Sans';
        src: url('https://vk.com/fonts/VKSans-Bold.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }
    </style>

    <style>
      :root {
        /* VK brand palette (guidelines) */
        --vk-blue: #0077ff;
        --vk-light-blue: #00eaff;
        --vk-green: #17d685;
        --vk-purple: #8024c0;
        --vk-magenta: #ff3985;

        --vk-white: #ffffff;
        --vk-grey: #dedede;
        --vk-warm-grey: #beb6ae;
        --vk-black: #212121;

        /* UI neutrals */
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #fbfbfc;
        --stroke: rgba(33, 33, 33, 0.12);
        --stroke-2: rgba(33, 33, 33, 0.18);

        --text: rgba(33, 33, 33, 0.92);
        --muted: rgba(33, 33, 33, 0.64);
        --faint: rgba(33, 33, 33, 0.48);

        --shadow: 0 18px 50px rgba(33, 33, 33, 0.12);
        --shadow-soft: 0 8px 24px rgba(33, 33, 33, 0.08);

        --radius-xl: 22px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;

        --container: 1120px;

        --font: 'VK Sans', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background: radial-gradient(
            900px 520px at 18% -5%,
            rgba(0, 234, 255, 0.16),
            transparent 60%
          ),
          radial-gradient(
            900px 520px at 85% 5%,
            rgba(0, 119, 255, 0.16),
            transparent 60%
          ),
          radial-gradient(
            900px 520px at 60% 100%,
            rgba(23, 214, 133, 0.12),
            transparent 60%
          ),
          linear-gradient(180deg, #f6f7f9 0%, #f4f6fb 40%, #f6f7f9 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .auth-container {
        width: 100%;
        max-width: 420px;
      }

      .auth-card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: var(--radius-xl);
        border: 1px solid var(--stroke);
        box-shadow: var(--shadow);
        padding: 40px 32px;
        text-align: center;
      }

      .auth-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 24px;
        color: var(--text);
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 4px;
      }

      .auth-title-vk {
        color: var(--vk-blue);
      }

      .auth-subtitle {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 32px;
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
      }

      .btn {
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.9);
        color: rgba(33, 33, 33, 0.88);
        padding: 16px 24px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        user-select: none;
        transition: 0.15s ease;
        border: none;
        width: 100%;
        margin-bottom: 16px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-soft);
        border-color: rgba(0, 119, 255, 0.22);
      }

      .btn--vk {
        border-color: rgba(0, 119, 255, 0.32);
        background: linear-gradient(
          180deg,
          rgba(0, 119, 255, 0.18),
          rgba(0, 119, 255, 0.08)
        );
        color: var(--vk-blue);
      }

      .btn--vk:hover {
        background: linear-gradient(
          180deg,
          rgba(0, 119, 255, 0.25),
          rgba(0, 119, 255, 0.15)
        );
      }

      .btn--demo {
        border-color: rgba(23, 214, 133, 0.32);
        background: linear-gradient(
          180deg,
          rgba(23, 214, 133, 0.15),
          rgba(23, 214, 133, 0.05)
        );
        color: var(--vk-green);
      }

      .btn--demo:hover {
        background: linear-gradient(
          180deg,
          rgba(23, 214, 133, 0.22),
          rgba(23, 214, 133, 0.12)
        );
      }

      .vk-icon {
        width: 24px;
        height: 24px;
        background: var(--vk-blue);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
      }

      .demo-login {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--stroke);
      }

      .demo-login p {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      @media (max-width: 400px) {
        .auth-card {
          padding: 32px 24px;
        }
        
        .auth-title {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">
          <span class="auth-title-vk">VK</span> Teams
        </h1>
        
        <p class="auth-subtitle">
          Сервис для рассылок и аналитики вовлечённости во внутренних коммуникациях
        </p>

        <button class="btn btn--vk" onclick="loginWithVK()">
          <span class="vk-icon">VK</span>
          Войти через VK ID
        </button>

        <div class="demo-login">
          <p>Для тестирования функционала:</p>
          <button class="btn btn--demo" onclick="demoLogin()">
            🔧 Войти в демо-режим
          </button>
        </div>
      </div>
    </div>

    <script>
      // Конфигурация VK OAuth
      const VK_CONFIG = {
        clientId: '8123576',
        redirectUri: window.location.origin + '/auth-callback.html',
        scope: 'email,notify,offline',
        version: '5.199',
        state: 'vk_teams_auth'
      };

      // Имитация входа через VK
      function loginWithVK() {
        showNotification('Для реальной авторизации необходимо зарегистрировать приложение VK', 'info');
        
        setTimeout(() => {
          simulateVKLogin();
        }, 1500);
      }

      // Симуляция входа через VK API
      function simulateVKLogin() {
        const userData = {
          id: Math.floor(Math.random() * 1000000) + 1000000,
          first_name: 'Иван',
          last_name: 'Петров',
          photo_200: 'https://vk.com/images/camera_200.png',
          email: 'user@example.com'
        };
        
        localStorage.setItem('vk_teams_auth', 'true');
        localStorage.setItem('vk_teams_vk_user', JSON.stringify({
          id: userData.id,
          name: `${userData.first_name} ${userData.last_name}`,
          avatar: '👨‍💻',
          email: userData.email,
          photo: userData.photo_200
        }));
        
        showNotification(`Успешный вход через VK: ${userData.first_name} ${userData.last_name}`, 'success');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      }

      // Демо-вход без VK
      function demoLogin() {
        showNotification('Вход в демо-режим...', 'info');
        
        setTimeout(() => {
          localStorage.setItem('vk_teams_auth', 'true');
          localStorage.setItem('vk_teams_demo', 'true');
          localStorage.setItem('vk_teams_vk_user', JSON.stringify({
            id: 'demo_001',
            name: 'Демо Пользователь',
            avatar: '👤',
            email: 'demo@vk-teams.ru',
            photo: null
          }));
          
          window.location.href = 'index.html';
        }, 1000);
      }

      function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.textContent = message;
        notification.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          padding: 12px 16px;
          border-radius: 12px;
          background: ${type === 'info' ? 'var(--vk-blue)' : type === 'success' ? 'var(--vk-green)' : '#ffb238'};
          color: white;
          font-size: 14px;
          z-index: 1000;
          transform: translateX(120%);
          transition: transform 0.3s ease;
          box-shadow: 0 8px 24px rgba(33, 33, 33, 0.12);
        `;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.style.transform = 'translateX(0)';
        }, 10);
        
        setTimeout(() => {
          notification.style.transform = 'translateX(120%)';
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 3000);
      }

      // Проверяем, авторизован ли пользователь
      document.addEventListener('DOMContentLoaded', function() {
        const isAuthenticated = localStorage.getItem('vk_teams_auth');
        
        if (isAuthenticated === 'true') {
          window.location.href = 'index.html';
        }
      });
    </script>
  </body>
</html>
